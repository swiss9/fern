name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: 'gradle'

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: '' # Bypass the deprecated 'tools' package
          accept-android-sdk-licenses: false # We will accept manually

      - name: Accept licenses and install NDK
        run: |
          mkdir -p $ANDROID_HOME/licenses
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "ndk;29.0.13113456"

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/fern-keystore.jks

      - name: Strip native libraries
        run: |
          set -e
          # Find the exact .so file in the plugin
          SO_FILE=$(find node_modules/llama-cpp-pro/android/src/main/jniLibs/arm64-v8a -name "*.so" | head -n 1)
          echo "Found .so file at: $SO_FILE"
          echo "Size before strip: $(du -h "$SO_FILE")"

          # Find the correct llvm-strip in the NDK
          NDK_DIR="${ANDROID_NDK_HOME:-$ANDROID_HOME/ndk/29.0.13113456}"
          STRIP_TOOL=$(find "$NDK_DIR" -name "llvm-strip" | grep "linux-x86_64" | head -n 1)
          echo "Using strip tool: $STRIP_TOOL"

          # Run the strip
          "$STRIP_TOOL" --strip-unneeded "$SO_FILE"

          echo "Size after strip: $(du -h "$SO_FILE")"
          ls -lh node_modules/llama-cpp-pro/android/src/main/jniLibs/arm64-v8a/

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
