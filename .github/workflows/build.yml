name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: '' # Bypass the deprecated 'tools' package
          accept-android-sdk-licenses: false # We will accept manually

      - name: Accept licenses and install NDK
        run: |
          mkdir -p $ANDROID_HOME/licenses
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "ndk;29.0.13113456"

      - name: Install dependencies
        run: npm install

      - name: Update llama.cpp to latest version
        run: |
          cd node_modules/llama-cpp-capacitor
          # Download the bootstrap script directly from the plugin's GitHub repo
          mkdir -p scripts
          curl -fsSL https://raw.githubusercontent.com/arusatech/llama-cpp-pro/v0.2.2/scripts/bootstrap.sh -o scripts/bootstrap.sh
          chmod +x scripts/bootstrap.sh
          ./scripts/bootstrap.sh master
          cd ../..

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
