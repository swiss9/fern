name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: '' # Bypass the deprecated 'tools' package
          accept-android-sdk-licenses: false # We will accept manually

      - name: Accept licenses and install NDK
        run: |
          mkdir -p $ANDROID_HOME/licenses
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "ndk;29.0.13113456"

      - name: Install dependencies
        run: npm install

      - name: Build latest llama.cpp for Android
        run: |
          git clone https://github.com/ggml-org/llama.cpp.git --depth 1
          cd llama.cpp
          cmake -B build-android \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF
          cmake --build build-android --config Release
          find build-android -name "libllama.so" -exec cp {} ../node_modules/llama-cpp-pro/android/src/main/jniLibs/arm64-v8a/libllama-cpp-arm64.so \;
          cd ..

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
