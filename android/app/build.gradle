apply plugin: 'com.android.application'

android {
    namespace = "com.fern.localai"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.fern.localai"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 67
        versionName "1.0.5"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
            universalApk false
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
            keepDebugSymbols += []
        }
    }
    signingConfigs {
        release {
            storeFile file("fern-keystore.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            ndk {
                debugSymbolLevel 'NONE'
            }
        }
    }
}

def requiredSigningEnv = ['KEYSTORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD']
gradle.taskGraph.whenReady { graph ->
    def buildingRelease = graph.allTasks.any {
        it.name == 'assembleRelease' || it.name == 'bundleRelease' || it.name == 'packageRelease'
    }
    if (buildingRelease) {
        def missing = requiredSigningEnv.findAll { !System.getenv(it) }
        if (missing) {
            throw new GradleException("Missing required signing environment variables: ${missing.join(', ')}")
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Task to strip the native library AFTER CMake builds it but BEFORE packaging
tasks.register("stripLlamaLibs") {
    doLast {
        def jniLibsDir = file("${projectDir}/src/main/jniLibs/arm64-v8a")
        // Also check the node_modules path where the plugin builds it
        def pluginJniDir = file("${rootProject.projectDir}/../node_modules/llama-cpp-pro/android/src/main/jniLibs/arm64-v8a")

        def ndkHome = System.getenv('ANDROID_NDK_HOME') ?: System.getenv('ANDROID_HOME')
        if (ndkHome == null) {
            throw new GradleException("ANDROID_NDK_HOME or ANDROID_HOME must be set to locate llvm-strip")
        }
        def stripTool = "${ndkHome}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
        if (!file(stripTool).exists()) {
            // Fallback: NDK installed under $ANDROID_HOME/ndk/<version>
            def found = fileTree(dir: "${ndkHome}/ndk", include: '**/llvm-strip').files
            if (found.isEmpty()) {
                throw new GradleException("llvm-strip not found under ${ndkHome}")
            }
            stripTool = found.first().absolutePath
        }

        [jniLibsDir, pluginJniDir].each { dir ->
            if (dir.exists()) {
                dir.eachFileMatch(~/.*\.so/) { soFile ->
                    println "Stripping: ${soFile.absolutePath}"
                    exec {
                        commandLine stripTool, '--strip-unneeded', soFile.absolutePath
                    }
                }
            }
        }
    }
}

// Hook the task to run before the APK is assembled
tasks.whenTaskAdded { task ->
    if (task.name == 'mergeReleaseNativeLibs' || task.name == 'packageRelease') {
        task.dependsOn 'stripLlamaLibs'
    }
}
